# =============================================================================
# NGINX CONFIGURATION
#
# Role: Reverse proxy in front of the API.
# In production: sits behind AWS ALB (Application Load Balancer).
# In self-hosted: faces the internet directly.
#
# Key features:
#   1. Rate limiting — per-IP limits to prevent abuse
#   2. Gzip compression — reduces bandwidth by ~70%
#   3. Security headers — XSS, clickjacking, MIME sniffing protection
#   4. Request size limits — prevents large payload attacks
#   5. Upstream keepalive — reuses connections to API (reduces latency)
#   6. Static file caching — Next.js static assets served with long TTL
# =============================================================================

# Rate limit zones — defined at http level, used in server blocks
# Zone 1: General API — 100 req/min per IP
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;

# Zone 2: Auth endpoints — 10 req/min per IP (brute force protection)
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

# Zone 3: File uploads — 5 req/min per IP
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=5r/m;

# Upstream: NestJS API servers
# In production: multiple API instances behind this upstream
upstream mpc_api {
    # Least connections — routes to API instance with fewest active connections
    # Better than round-robin for variable-length requests (AI generation can be slow)
    least_conn;

    server api:4000;
    # Add more servers for horizontal scaling:
    # server api_2:4000;
    # server api_3:4000;

    # Keepalive: reuse connections instead of creating new TCP connections per request
    # 32 idle connections kept alive — reduces latency by ~5ms per request
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS in production
    # Comment out if SSL is terminated at the load balancer (recommended)
    # return 301 https://$host$request_uri;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Remove server version from headers (security through obscurity)
    server_tokens off;

    # ── Request limits ──────────────────────────────────────────────────────
    # Max body size: 50MB — allows large CSV uploads
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 10s;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml;

    # ── Auth endpoints — strict rate limiting ───────────────────────────────
    location ~ ^/api/v[0-9]+/auth/(login|register) {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://mpc_api;
        include /etc/nginx/proxy_params;
    }

    # ── File upload endpoints ───────────────────────────────────────────────
    location ~ ^/api/v[0-9]+/data-sources/.*/upload {
        limit_req zone=api_upload burst=3 nodelay;

        # Larger timeout for file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://mpc_api;
        include /etc/nginx/proxy_params;
    }

    # ── General API ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://mpc_api;
        include /etc/nginx/proxy_params;
    }

    # ── Health check — no rate limiting, no auth ────────────────────────────
    location /api/v1/health {
        proxy_pass http://mpc_api;
        access_log off;  # don't log health checks
        include /etc/nginx/proxy_params;
    }

    # ── 429 error page ──────────────────────────────────────────────────────
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"success":false,"error":"Too many requests. Please slow down."}';
    }
}

# ── Proxy params (included in location blocks) ────────────────────────────────
# Saved as /etc/nginx/proxy_params — standard NginX include file
